[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/limits",
  "crates/pdf-parser",
  "crates/docx-parser",
  "crates/odt-parser",
  "crates/ods-parser",
  "crates/odp-parser",
  "crates/doc-parser",
  "crates/xlsx-parser",
  "crates/pptx-parser",
  "crates/image-parser",
  "crates/metafile",
  "crates/svg",
  "crates/drawingml",
  "crates/chart",
  "crates/picture-formats",
  "crates/formats",
  "crates/text-parser",
  "crates/layout",
  "crates/ocr-engine",
  "crates/json-exporter",
  "crates/md-exporter",
  "crates/pipeline",
  "crates/cli",
  "crates/ui",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["PdfExtractor Team"]
license = "MIT OR Apache-2.0"
rust-version = "1.92"

# The workspace holds no unsafe code, and every crate states the rule so a
# future one fails the build instead of arriving quietly in a parser that reads
# untrusted files. Each member opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Error handling
anyhow = "1"
thiserror = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The YAML writer encodes the same document model Docling's `--to yaml` writes.
serde_yaml = "0.9"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Directory-relative opens (`openat`) that hold each path component to the
# descriptor already opened, without following a link of its own. Safe
# wrappers, because the workspace forbids `unsafe`.
rustix = { version = "0.38", features = ["fs"] }

# Parallelism
rayon = "1"

# Image handling (reuse - pragmatic)
image = "0.25"
# CCITT Group 3/4 and JBIG2 are the two codecs scanned PDFs actually use.
# They are codecs, not domain logic, so maintained pure-Rust decoders are used
# rather than a second implementation of T.4/T.6/T.88 in this workspace.
hayro-ccitt = "0.5"
hayro-jbig2 = { version = "0.4", default-features = false, features = ["std"] }
# JPEG 2000 pixels, which `image` does not decode. A JP2 picture is transcoded
# to PNG before it reaches the model, because Docling cannot name `image/jp2`.
hayro-jpeg2000 = "0.4"
# The directories of a multi-page TIFF, which `image` reads only the first of:
# a scanner's batch is a page per directory, so the chain is walked here.
tiff = "0.11"

# Image processing primitives
imageproc = "0.25"

# XML parsing (DOCX)
quick-xml = { version = "0.42", features = ["serialize"] }

# DEFLATE/zlib decoding for PDF FlateDecode streams (reuse - not core domain logic)
flate2 = "1"

# PDF standard security handler: the cipher and hash primitives (reuse -
# infrastructure); the key derivation is ours (crates/pdf-parser/src/crypt.rs)
md-5 = "0.10"
sha2 = "0.10"
aes = "0.8"
# A revision 6 password is SASLprep'd (RFC 4013) before it is UTF-8 encoded, and
# the normalization step is NFKC; the preparation itself stays in `crypt.rs`.
unicode-normalization = "0.1"

# ZIP handling (DOCX - reuse). Only the methods an OPC/ODF package uses:
# stored (no feature) and DEFLATE. The decoders zip enables by default —
# bzip2, LZMA, XZ, Zstandard, PPMd, Deflate64 — are never reached by these
# packages, and WinZip AES is a password path this workspace does not offer.
zip = { version = "9", default-features = false, features = ["deflate"] }

# OCR - start with Tesseract bindings
leptess = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Image embedding: a `data:` URI carries the picture's bytes in the document
# itself (`--image-export-mode embedded`).
base64 = "0.23"

# LaTeX to MathML for the HTML writer: an equation is written as the typeset
# markup a browser draws, with its TeX kept in an `<annotation>`.
pulldown-latex = "0.8"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
