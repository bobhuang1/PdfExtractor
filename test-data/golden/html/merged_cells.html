<h2>Scores by class</h2>
<p>The header spans two columns, and each class letter runs down two rows.</p>
<table>
<thead>
<tr><th>Class</th><th>Student</th><th colspan="2">Results</th></tr>
</thead>
<tbody>
<tr><td rowspan="2">A</td><td>Alice</td><td>71</td><td>84</td></tr>
<tr><td>Bob</td><td>65</td><td>79</td></tr>
<tr><td rowspan="2">B</td><td>Carol</td><td>90</td><td>88</td></tr>
<tr><td>Dave</td><td>77</td><td>82</td></tr>
</tbody>
</table>
<p>Rows without a class letter continue the one above.</p>
</body>
</html>
