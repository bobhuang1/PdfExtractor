- children: []
  content_layer: body
  label: paragraph
  orig: Images can be of three main types. Inline images are images that are part of the normal text flow, like this image of a green dot . Inline images do not cause breaks in the text and are usually small in size. The next category of image is a floating image, one that “floats “ on the page and is surrounded by text. Word supports more types of floating images than are possible with current ebook technology, so the conversion maps floating images to simple left and right floats, as you can see with the left and right arrow images on the sides of this paragraph.
  parent:
    $ref: '#/body'
  prov: []
  self_ref: '#/texts/54'
  text: Images can be of three main types. Inline images are images that are part of the normal text flow, like this image of a green dot . Inline images do not cause breaks in the text and are usually small in size. The next category of image is a floating image, one that “floats “ on the page and is surrounded by text. Word supports more types of floating images than are possible with current ebook technology, so the conversion maps floating images to simple left and right floats, as you can see with the left and right arrow images on the sides of this paragraph.
- children: []
  content_layer: body
  label: paragraph
  orig: The final type of image is a “block” image, one that becomes a paragraph on its own and has no text on either side. Below is a centered green dot.
  parent:
    $ref: '#/body'
  prov: []
  self_ref: '#/texts/55'
  text: The final type of image is a “block” image, one that becomes a paragraph on its own and has no text on either side. Below is a centered green dot.
- children: []
