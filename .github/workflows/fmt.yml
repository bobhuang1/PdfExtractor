# The formatting gate, on every push: rustfmt's own reading of every crate.
#
# `cargo fmt --all --check` formats every package in the workspace in memory and
# compares the result with what is committed. It writes nothing, exits non-zero
# and names each file whose text differs, with the diff it would have made. So
# drift — a file formatted by hand, a merge that kept both sides, an editor's
# idea of where a line breaks — fails here rather than turning up as unrelated
# noise inside the next feature change's diff. `--all` is the workspace, not
# only the package at the root.
#
# The command is the one README's "Build and test" gives, run by hand the same
# way:
#
#     cargo fmt --all --check
#
# Nothing is compiled, so this job installs no native libraries and wants no
# cache: rustfmt reads the sources the checkout has already put there.

name: the formatting gate

# Formatting can only change with Rust sources, rustfmt's configuration, or the
# manifests that decide which crates are in the workspace. A docs-only push
# spends no minutes, and `branches` leaves tag pushes to the release workflow.
on:
  push:
    branches: ["**"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "rustfmt.toml"
      - ".rustfmt.toml"
      - "rust-toolchain*"
      - ".github/workflows/fmt.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    name: every crate, formatted as rustfmt reads it
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # rustfmt is a toolchain component rather than a crate; the pinned toolchain
      # with it added is the whole of this job's setup. The pin is installed
      # rather than left to rustup: `rust-toolchain.toml` names 1.99.0, and
      # rustup's automatic install of a toolchain it is missing is deprecated —
      # a future rustup would end this job instead of fetching it. `@stable` is
      # the action's own ref; the `toolchain` input is the pin. (The runner image
      # still floats: rustfmt compiles nothing, so a new image changes no reading.)
      - name: The pinned toolchain, with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt

      - name: rustfmt, with drift refused
        run: cargo fmt --all --check
