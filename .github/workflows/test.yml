# The test gate, on every push that changes what it reads: every test of every
# crate, run as the README's "Build and test" runs it by hand.
#
#     cargo test --workspace --locked
#
# `--locked` so the gate also proves the committed lockfile is the one the
# workspace builds from: a failing test and a stale lock are then the same red
# build. Nothing is filtered — the unit tests, the corpus report, the golden
# suite and the command line's own integration tests all run. The `test` job has
# no Python with docling-core, and `docling_core_accepts_our_documents` fails
# rather than passing when nothing can load the corpus, so this job opts out in
# so many words (`DOCLING_SKIP_ORACLE=1`); the `docling` job installs that
# Python, points `DOCLING_PY` at it and runs the same suite with the oracle live.
#
# The suite compiles the desktop shell as well as the CLI, and OCR is a required
# capability, so both jobs install what they need on Linux: the Tesseract and
# Leptonica libraries the CLI links (and libclang, which builds the bindings) with
# `tesseract-ocr`/`tesseract-ocr-eng` for the language data the OCR tests
# recognise with, and the WebKitGTK and GTK development packages the shell's
# default features need. These are the same packages the clippy gate installs,
# plus the OCR data.
#
# LibreOffice is not installed, on purpose, and the suite is green without it.
# The lookup reads only fixed install paths (`PATH` is never searched), so a
# `PDFE_SOFFICE` naming a file that does not exist turns the bridge off even on
# a machine that has LibreOffice installed:
#
# * the CLI suite's bridge tests return early and say so (`soffice_binary()`);
# * the corpus report keeps the baseline entries of the documents it could not
#   measure — the four legacy `.doc` documents in `test-data/real` — rather than
#   recording a reading it did not make;
# * the golden suite's corpus comparison still passes: a `.doc` read by the
#   built-in reader instead of the bridge keeps its body text, and both readings
#   report no pages, so all four stay above the 0.85 floor (equation 1.000,
#   two_images 1.000, FloatingPictures 0.971, testPictures 0.941).
#
# Installing it would put the runner's LibreOffice between the ratchet and the
# numbers the baseline was measured with — the bridge's readings depend on the
# installed version, which is the same reason the compare gate measures with
# `--ocr never`. A run here is therefore the suite a fresh checkout on a machine
# without LibreOffice gets, and the bridge is gated on the machines that have it.
#
# The runner image is pinned rather than `ubuntu-latest`, for the reason
# `bridge.yml` pins its own: these jobs' readings are made with the image's own
# packages. The OCR floors in `crates/cli/tests/ocr_quality_test.rs` were recorded
# with Tesseract 5.3.4 and Leptonica 1.82 — the engine family the 24.04 image
# installs, and the one every push here has passed against — and their margins are
# the room a different build is *allowed*, not a promise that any build stays
# above them. `ubuntu-latest` is 24.04 today (image 20261025) and is migrating to
# Ubuntu 26, which would exchange the OCR engine under those floors by itself: a
# red run on an unchanged tree, whose likeliest repair is lowering a floor — the
# very regression the floors exist to catch. Pinned, moving the image is a change
# that says so, re-measures the floors and moves them in the same commit.
#
# The other per-push gates are pinned to the same image, and not for a reading: clippy
# and the compare gate both compile the command line, whose build scripts read
# `libleptonica-dev`, and Ubuntu 26.04's Leptonica 1.86 cannot be bound by the
# `leptonica-sys` 0.4.9 in the lockfile (`environ.h:70: error: unknown type name
# 'atomic_int'`). Floating there does not catch a defect; it fails in a build script
# before a lint or a document is read. `release.yml`'s Linux legs are pinned with them,
# so a shipped binary links the libraries the floors were measured with. Rustfmt alone
# floats, because it compiles nothing and so still meets a new image on the push.

name: the test gate

# A routine push runs the workspace once, and only when it touches something the
# suite reads: Rust sources and manifests, the window's frontend, test data, or
# this workflow. Documentation-only pushes spend no minutes. Superseded runs on
# the same ref are cancelled rather than left to finish.
#
# The Docling oracle is a second full workspace run, so it is not part of the
# per-push gate: it runs weekly and by hand. A push still runs every test; only
# the oracle-backed variant is deferred. `branches` is stated so tag pushes do
# not run this gate as well — releases have their own workflow.
on:
  push:
    branches: ["**"]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "crates/ui/dist/**"
      - "crates/ui/tauri.conf.json"
      - "crates/ui/capabilities/**"
      - "test-data/**"
      - ".cargo/**"
      - "rust-toolchain*"
      - ".github/workflows/test.yml"
  schedule:
    # The oracle needs no per-push cadence; weekly catches drift without paying
    # for a second full suite on every change.
    - cron: '43 6 * * 3'
  workflow_dispatch:

# One run per ref: a new push cancels the run it supersedes, so a force-push or
# a quick follow-up does not pay for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: every crate, every test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The pin, installed rather than left to rustup: `rust-toolchain.toml`
      # names 1.99.0, and rustup's automatic install of a toolchain it is missing
      # is deprecated — a future rustup would end this job instead of fetching
      # it. `@stable` is the action's own ref; the `toolchain` input is the pin.
      - name: The pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      # The native libraries the workspace needs, and the OCR data the tests
      # recognise with.
      - name: The native libraries and OCR data the workspace needs
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libtesseract-dev libleptonica-dev libclang-dev \
            tesseract-ocr tesseract-ocr-eng \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}

      - name: The workspace suite
        env:
          # No Python with docling-core here. The test fails rather than passing
          # unvalidated, so this run says the loader layer did not run.
          DOCLING_SKIP_ORACLE: 1
        run: cargo test --workspace --locked

  docling:
    name: every crate, every test, with the Docling oracle
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: The pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      # The same native libraries and OCR data as the `test` job: this job runs
      # the whole workspace, including the desktop shell and the OCR tests.
      - name: The native libraries and OCR data the workspace needs
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libtesseract-dev libleptonica-dev libclang-dev \
            tesseract-ocr tesseract-ocr-eng \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev

      - name: The Docling oracle's Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The references were generated with docling-core 2.101.1, so the oracle
      # is pinned to that version rather than floating with the latest release.
      - name: Install docling-core
        env:
          DOCLING_PY: ${{ runner.temp }}/docling-venv/bin/python
        run: |
          python -m venv "$RUNNER_TEMP/docling-venv"
          "$DOCLING_PY" -m pip install --disable-pip-version-check 'docling-core==2.101.1'
          "$DOCLING_PY" -c 'from importlib.metadata import version; print("docling-core", version("docling-core"))'

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-docling-${{ hashFiles('**/Cargo.lock') }}

      # `DOCLING_PY` is the Python `docling_core_accepts_our_documents` loads
      # the corpus with — unset, that test fails rather than passing unvalidated
      # — so this is the full suite with Docling's own model as the authority on
      # every document it writes.
      - name: The workspace suite with the Docling oracle
        env:
          DOCLING_PY: ${{ runner.temp }}/docling-venv/bin/python
        run: cargo test --workspace --locked
