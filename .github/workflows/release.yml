# A release build, on a version tag.
#
# A `v*` tag builds the artifacts the release carries: the command line for the
# three platforms, and the window's installers (deb + AppImage, msi, dmg). The
# workflow can also be run by hand (`workflow_dispatch`), which builds and
# packages everything without publishing anything — that is how a change to
# this file is tested before a tag depends on it.
#
# The artifacts travel as release assets, not Actions artifacts: a draft
# release is created before anything builds, each platform uploads its files
# into it with `gh`, and the last job publishes it with the checksums. Release
# assets have their own storage (2 GB per release), where Actions artifact
# storage is a per-account quota this repository has run out of.
#
# Two rules the builds hold to:
#   * `--locked` everywhere, so a released binary is the lockfile's build.
#   * the tag names the workspace version (`v0.1.0` for version 0.1.0). The
#     finalize job compares the tag with `Cargo.toml`, `tauri.conf.json` and
#     the built binary's own `VERSION` file, and fails loudly on any
#     disagreement, so a tag can never ship binaries of another version.
#
# The window bundles carry the command line as a resource, so an installed
# window converts without a separate install: `crates/ui/src/main.rs` names the
# resource directory's copy at startup, and `locate_cli` runs that one.
#
# The artifacts are not code-signed — signing keys are not in this repository —
# so Gatekeeper and SmartScreen will ask the user to confirm the first launch.
# That is expected, and the release notes say so.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: the draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Open a draft release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "PDF Extractor $GITHUB_REF_NAME" \
            --generate-notes

  cli:
    name: the command line · ${{ matrix.target }}
    # The draft must exist before anything uploads to it; `!cancelled()` lets
    # the builds still run when the draft was skipped (a hand-run has no tag).
    needs: [draft]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The English data Tesseract recognises with. Every package carries it
      # beside the binary (see `ocr-engine`'s shipped-tessdata lookup), so OCR
      # runs on a machine with no Tesseract install of its own — Windows has
      # none to find. Pinned to a commit and checked by hash: a released
      # package's OCR data is the same bytes on every build.
      - name: English tessdata, pinned
        shell: bash
        env:
          TESSDATA_COMMIT: 923915d4ced2a7235221788285785a29c4a42d4a
          TESSDATA_SHA256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
        run: |
          set -euo pipefail
          # Under target/ rather than the source tree: the workspace stays
          # clean, and this runs after checkout (which cleans untracked files).
          mkdir -p target/package-tessdata
          curl -fsSL \
            "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/$TESSDATA_COMMIT/eng.traineddata" \
            -o target/package-tessdata/eng.traineddata
          if command -v sha256sum >/dev/null 2>&1; then
            echo "$TESSDATA_SHA256  target/package-tessdata/eng.traineddata" | sha256sum -c -
          else
            echo "$TESSDATA_SHA256  target/package-tessdata/eng.traineddata" | shasum -a 256 -c -
          fi

      # The CLI links the Tesseract bindings (`leptess` → `tesseract-sys`): the
      # libraries are needed to link, libclang to build the bindings. Each
      # platform keeps its own copy of Tesseract.
      - name: Tesseract and libclang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libtesseract-dev libleptonica-dev tesseract-ocr tesseract-ocr-eng libclang-dev

      - name: Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract pkg-config

      # Windows: vcpkg's tesseract (which brings its leptonica). The bindings
      # find it through the vcpkg crate, which reads `VCPKG_ROOT` — exported
      # for the build from the runner's own `VCPKG_INSTALLATION_ROOT`.
      - name: Tesseract (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-binarycache
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install tesseract:x64-windows

      # The binary cache turns a from-source tesseract (a twenty-minute
      # Windows job) into a download on every later run. It only takes effect
      # once a run has filled it, so the first Windows run is the slow one.
      - name: Cache vcpkg
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-binarycache
          key: vcpkg-tesseract-x64-windows

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache the crates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build the command line
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export VCPKG_ROOT="$VCPKG_INSTALLATION_ROOT"
            export LIBCLANG_PATH="C:/Program Files/LLVM/bin"
            # vcpkg-rs' default triplet is x64-windows-static-md and it refuses
            # a dynamic one without this opt-in — while the packages above
            # install `tesseract:x64-windows`. Without this the build dies with
            # "package leptonica is not installed for vcpkg triplet
            # x64-windows-static-md".
            export VCPKGRS_DYNAMIC=1
          fi
          cargo build --locked --release --package pdfextractor-cli

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="pdfextractor-cli-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin="target/release/pdfextractor-cli"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$bin.exe" "dist/$name/"
            # vcpkg's tesseract is a dynamic library; the release carries its
            # DLLs beside the binary, which is where Windows looks for them.
            cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/"*.dll "dist/$name/"
            bin="$bin.exe"
          else
            cp "$bin" "dist/$name/"
          fi
          cp README.md "dist/$name/"
          # The OCR data the binary looks for beside itself, so the archive
          # runs on a machine with no Tesseract installed.
          mkdir -p "dist/$name/tessdata"
          cp target/package-tessdata/eng.traineddata "dist/$name/tessdata/"
          # The binary, run here, states its own version: a package that cannot
          # even start is caught before it is uploaded.
          "dist/$name/$(basename "$bin")" --version | tee "dist/$name/VERSION"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
          else
            tar -czf "dist/$name.tar.gz" -C dist "$name"
          fi
          rm -rf "dist/$name"

      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "dist/pdfextractor-cli-${GITHUB_REF_NAME}-${{ matrix.target }}.${{ matrix.archive }}"

  window:
    name: the window · ${{ matrix.target }}
    needs: [draft]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The English data Tesseract recognises with, pinned and checked by hash
      # (see the command line's job): the bundle carries it beside the command
      # line, so an installed window can run OCR on its own.
      - name: English tessdata, pinned
        shell: bash
        env:
          TESSDATA_COMMIT: 923915d4ced2a7235221788285785a29c4a42d4a
          TESSDATA_SHA256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
        run: |
          set -euo pipefail
          mkdir -p target/package-tessdata
          curl -fsSL \
            "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/$TESSDATA_COMMIT/eng.traineddata" \
            -o target/package-tessdata/eng.traineddata
          if command -v sha256sum >/dev/null 2>&1; then
            echo "$TESSDATA_SHA256  target/package-tessdata/eng.traineddata" | sha256sum -c -
          else
            echo "$TESSDATA_SHA256  target/package-tessdata/eng.traineddata" | shasum -a 256 -c -
          fi

      # The same Tesseract as the command line's build, plus what the window
      # itself links (WebKitGTK and friends) and libfuse2, which the AppImage
      # tool needs on modern Ubuntu.
      - name: Tesseract, WebKitGTK and libfuse2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libtesseract-dev libleptonica-dev tesseract-ocr tesseract-ocr-eng libclang-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libfuse2

      - name: Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract pkg-config

      - name: Tesseract (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-binarycache
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install tesseract:x64-windows

      - name: Cache vcpkg
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-binarycache
          key: vcpkg-tesseract-x64-windows

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache the crates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-release-window-${{ hashFiles('**/Cargo.lock') }}

      # The bundle carries this build of the command line as a resource
      # (`bundle.resources` in `tauri.conf.json`), so it must exist before the
      # bundler runs.
      - name: Build the command line the window bundles
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export VCPKG_ROOT="$VCPKG_INSTALLATION_ROOT"
            export LIBCLANG_PATH="C:/Program Files/LLVM/bin"
            # vcpkg-rs' default triplet is x64-windows-static-md and it refuses
            # a dynamic one without this opt-in — while the packages above
            # install `tesseract:x64-windows`. Without this the build dies with
            # "package leptonica is not installed for vcpkg triplet
            # x64-windows-static-md".
            export VCPKGRS_DYNAMIC=1
          fi
          cargo build --locked --release --package pdfextractor-cli
          if [ "$RUNNER_OS" = "Windows" ]; then
            # The bundle carries the command line (and, by `bundle.resources`, anything
            # named *.dll beside it); on Windows the vcpkg DLLs must be beside the
            # binary the bundler copies, or an installed window cannot start a run.
            cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/"*.dll target/release/
          fi

      - name: Install the Tauri bundler
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Build the window and its bundle
        working-directory: crates/ui
        shell: bash
        run: |
          # The bundle carries the command line the window names at startup
          # (`crates/ui/src/main.rs`) and, beside it, the tessdata OCR reads —
          # an installed window converts without a Tesseract install of its own.
          # The resource globs are passed here rather than committed:
          # tauri-build resolves them at compile time and fails a build where
          # one matches nothing, and `*.dll` matches nothing outside Windows —
          # while an ordinary `cargo build` must never need a release binary to
          # exist.
          config='{"bundle":{"resources":{"../../target/release/pdfextractor-cli*":"","../../target/package-tessdata/*":"tessdata"}}}'
          if [ "$RUNNER_OS" = "Windows" ]; then
            config='{"bundle":{"resources":{"../../target/release/pdfextractor-cli*":"","../../target/release/*.dll":"","../../target/package-tessdata/*":"tessdata"}}}'
          fi
          cargo tauri build --bundles ${{ matrix.bundles }} --config "$config"

      # What the deb will tell apt to install alongside it. The window runs
      # Tesseract at conversion time, so this is the difference between an
      # installed window that converts and one that fails to start a run.
      - name: What the deb declares as its dependencies
        if: runner.os == 'Linux'
        run: dpkg-deb -f target/release/bundle/deb/*.deb Depends

      - name: Collect the bundles
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          target="${{ matrix.target }}"
          mkdir -p dist
          case "$RUNNER_OS" in
            Linux)
              cp target/release/bundle/deb/*.deb "dist/pdf-extractor-${tag}-${target}.deb"
              cp target/release/bundle/appimage/*.AppImage "dist/pdf-extractor-${tag}-${target}.AppImage"
              ;;
            Windows)
              cp target/release/bundle/msi/*.msi "dist/pdf-extractor-${tag}-${target}.msi"
              ;;
            macOS)
              cp target/release/bundle/dmg/*.dmg "dist/pdf-extractor-${tag}-${target}.dmg"
              ;;
          esac
          ls -la dist

      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            dist/*

  finalize:
    name: the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [draft, cli, window]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The tag, the workspace and the window's config must all say the same
      # version, or nothing is published.
      - name: The tag names the version being released
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^\[workspace.package\]/{p=1} p && /^version/{print $2; exit}' Cargo.toml)"
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then echo "::error::no version in [workspace.package]"; exit 1; fi
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name the workspace version $version"; exit 1
          fi
          grep -q "\"version\": \"$version\"" crates/ui/tauri.conf.json || {
            echo "::error::tauri.conf.json says another version than $version"; exit 1; }

      - name: Take the draft's assets and checksum them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist
          # Every archive says its own version inside it; one of them saying
          # anything else stops the release here.
          for file in dist/pdfextractor-cli-*.tar.gz; do
            said="$(tar -xzOf "$file" --wildcards '*/VERSION')"
            echo "$file: $said"
            case "$said" in *"${GITHUB_REF_NAME#v}"*) ;; *)
              echo "::error::$file was built from another version ($said)"; exit 1 ;; esac
          done
          (cd dist && find . -type f ! -name SHA256SUMS.txt -printf '%P\n' | sort | xargs sha256sum > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      # What the auto-generated notes cannot know: what each package needs to
      # run, and that nothing here is signed.
      - name: Say what the release needs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json body -q .body > dist/notes.md
          cat >> dist/notes.md <<'EOF'

          ## What each package needs

          - **Windows (`.zip`, `.msi`)**: nothing else — the command line and the
            window carry Tesseract and its English data.
          - **Linux command line (`.tar.gz`)**: `libtesseract5`
            (`sudo apt install libtesseract5` on Debian/Ubuntu); the OCR data is
            in the archive.
          - **Linux window (`.deb`, `.AppImage`)**: the deb declares its own
            dependencies; for the AppImage, `libtesseract5` on the host.
          - **macOS (`.tar.gz`, `.dmg`)**: `brew install tesseract` — the binaries
            link Homebrew's Tesseract.

          None of the binaries are code-signed, so Gatekeeper and SmartScreen
          will ask you to confirm the first launch.
          EOF
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --notes-file dist/notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            dist/SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
