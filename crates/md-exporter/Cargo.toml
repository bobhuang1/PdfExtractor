[package]
name = "pdfextractor-md-exporter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
# A picture can be carried inside the page as a base64 `data:` URI instead of
# being referenced beside it (`--image-export-mode embedded`).
base64.workspace = true
pdfextractor-core = { path = "../core" }
# A chunk is a serialisable record in Docling's shape (`--to chunks`).
serde.workspace = true
# The HTML writer typesets an equation as MathML, keeping its LaTeX in an
# `<annotation>` so the page reads back as the equation it was.
pulldown-latex.workspace = true
# The YAML writer goes through the JSON value so its keys come out in the
# order `--to json` writes them (serde_json's map is sorted).
serde_json.workspace = true
serde_yaml.workspace = true
# The Hugging Face loader for `--chunks-tokenizer` needs no training, progress
# bar or Oniguruma regex; the other two formats use the crates below.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
# A SentencePiece `.model` is read by its own pure-Rust runtime, without a C++
# build or a model download.
sentencepiece-rs = "0.2"
# A tiktoken vocabulary is a rank file, not a full tokenizer; the ranks are
# loaded into this implementation and counted with the same BPE rules.
tiktoken-rs = { version = "0.12", default-features = false }

[lints]
workspace = true
